name: gitleaks

on:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan git history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # gitleaks-action@v2 installs 8.24.3 unless this is set. 8.24.3
          # reads only the singular [allowlist] table and ignores [[allowlists]].
          GITLEAKS_VERSION: "8.28.0"
